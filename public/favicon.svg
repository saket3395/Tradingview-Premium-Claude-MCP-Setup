<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="TV × Claude Intraday MCP">
  <!-- Terminal ground with a hairline edge — the same chassis the app uses. -->
  <rect width="32" height="32" rx="7" fill="#0e1117"/>
  <rect x="0.5" y="0.5" width="31" height="31" rx="6.5" fill="none" stroke="#272e3a"/>
  <!-- One bull candle, one bear candle: the two states the whole product reads for.
       Sized to stay legible when the browser paints this at 16px. -->
  <g stroke-linecap="round">
    <line x1="11" y1="6"  x2="11" y2="26" stroke="#26a17b" stroke-width="2"/>
    <rect x="8" y="11" width="6" height="11" rx="1.5" fill="#26a17b"/>
    <line x1="21" y1="8"  x2="21" y2="27" stroke="#e5534b" stroke-width="2"/>
    <rect x="18" y="14" width="6" height="9" rx="1.5" fill="#e5534b"/>
  </g>
</svg>
